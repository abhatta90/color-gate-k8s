plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Runs background work only in the active blue/green color, told by a Kubernetes ConfigMap informer'

dependencies {
    api 'org.springframework.boot:spring-boot-starter'
    // Intercepts @Scheduled / @ColorGated methods
    api 'org.springframework.boot:spring-boot-starter-aop'

    // Kubernetes client with the JDK's built-in HTTP client (instead of the default Vert.x one)
    api("io.fabric8:kubernetes-client:${fabric8Version}") {
        exclude group: 'io.fabric8', module: 'kubernetes-httpclient-vertx'
    }
    api "io.fabric8:kubernetes-httpclient-jdk:${fabric8Version}"

    // Only used when the service has actuator: exposes /actuator/colorgate and the colorgate.* gauges
    compileOnly 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    compileOnly 'io.micrometer:micrometer-core'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation "io.fabric8:kubernetes-server-mock:${fabric8Version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            // Write the resolved versions into the published POM and Gradle metadata.
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    // To publish to your company repository (Nexus/Artifactory), add it here, e.g.:
    // repositories {
    //     maven {
    //         url = 'https://nexus.example.com/repository/maven-releases/'
    //         credentials { username = findProperty('repoUser'); password = findProperty('repoPassword') }
    //     }
    // }
}
